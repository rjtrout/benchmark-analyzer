# The five open-weight models that stand highest on the Open ASR Leaderboard's English
# short-form table, and what that table says about each.
#
# The table was read on 24 November 2026, at leaderboard version 1.16.2, from
# https://huggingface.co/spaces/hf-audio/open_asr_leaderboard. A model is open-weight when
# the table marks it so: its weights are on the Hugging Face Hub. Each of the five has its
# transcripts in the leaderboard's public bucket, and those files are all this project reads.
#
# published  The table's WER on each public set. `ba reproduce` puts ours beside it. Seven
#            are columns the page opens with. URGENT24 Clean is a column too, switched off
#            by default: it is `urgent-clean` here.
#
# The comment above each model gives its rank among the table's 68 models, hosted services
# included, and the table's Average WER, both in the view the page opens with: seven of
# the public sets below and two private ones.
#
# To compare other models, change the entries. Any model with transcripts in the bucket
# works, and published can be left out.

